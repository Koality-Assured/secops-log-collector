[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secops-log-collector"
version = "1.0.0"
description = "Modern, serverless event-driven security log collection engine for enterprise cloud SecOps"
readme = "README.md"
authors = [
    { name = "Koality Assured SecOps Engineering", email = "secops@koalityassured.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["security", "secops", "logging", "okta", "crowdstrike", "datadog", "github", "sentinelone", "logscale", "s3", "opensearch", "serverless", "aws-lambda"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

dependencies = [
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "pyyaml>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["secops_collector*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B027"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
